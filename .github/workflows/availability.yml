name: Admira Studio external availability

on:
  # Automatic checks run in tools/availability-worker (Cloudflare Cron, every 5 min).
  # Retain this workflow as an explicitly requested diagnostic only; avoid duplicate probe quota.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: studio-public-availability
  cancel-in-progress: false

jobs:
  external-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore previous observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p availability
          python3 scripts/restore-availability.py
      - name: Check from Spanish residential, German and US networks
        run: python3 scripts/check-availability.py
      - name: Keep sanitized observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-public-availability
          path: availability/report.json
          retention-days: 14
          if-no-files-found: error
