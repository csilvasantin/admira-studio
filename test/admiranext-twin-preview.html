<!doctype html><html><meta charset="utf-8"><title>AdmiraNeXT · prueba de gemelo</title><body style="margin:0;background:#15221e;color:#d8ffdf;font:18px sans-serif"><h1>AdmiraNeXT · Gran de Gràcia 51 · primera planta</h1><p id="status">Cargando los dos equipos V-H-V…</p><canvas id="scene" style="width:100vw;height:75vh"></canvas><script type="module">
import {createFormatTwin} from '/adaptaciones/gemelo-factory.mjs';
import {twinGeometry} from '/adaptaciones/gemelo-core.mjs';
try{const f=await (await fetch('/adaptaciones/proyectos/admiranext.json')).json(),i=f.instalaciones[0];const twin=await createFormatTwin({canvas:document.querySelector('canvas'),format:{installation:i},geometry:twinGeometry({installation:i},{ancho:i.width,alto:i.height}),formatId:i.id});twin.viewer.resize(innerWidth,innerHeight*.75);twin.home();function frame(){twin.draw(cv=>{const c=cv.getContext('2d');c.fillStyle='#124b36';c.fillRect(0,0,cv.width,cv.height);c.fillStyle='#a8ffab';c.font='bold 56px sans-serif';c.fillText('ADMIRA NEXT',40,150);c.fillStyle='#32b7d3';c.fillRect(cv.width*.35,0,cv.width*.25,cv.height);});requestAnimationFrame(frame);}frame();document.querySelector('#status').textContent='MacStudio V-H-V + MacMini V-H-V · '+twin.surfaces+' pantallas · geometría nominal';}catch(e){document.querySelector('#status').textContent='ERROR: '+e.message;}
</script></body></html>
