# Configuración de producción de Cloudflare Pages para admira.studio.
# Es propia del destino: sync.sh nunca la hereda de Pixeria.
name = "admira-studio"
pages_build_output_dir = "."
compatibility_date = "2026-08-02"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "AUTH_DB"
database_id = "1568f825-4dfb-40a9-ac40-c6776ee62b3e"

[[env.production.d1_databases]]
binding = "AUTH_DB"
database_name = "AUTH_DB"
database_id = "1568f825-4dfb-40a9-ac40-c6776ee62b3e"
